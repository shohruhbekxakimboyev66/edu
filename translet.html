<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Tarjimon Pro - 50+ Til</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --danger: #f72585;
            --warning: #f8961e;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        .dark-mode {
            --primary: #536dfe;
            --secondary: #4c5ecf;
            --light: #2d2d44;
            --dark: #f8f9fa;
            --gray: #adb5bd;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: var(--transition);
        }

        .dark-mode body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .container {
            max-width: 1400px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            color: white;
            position: relative;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .settings-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .dark-mode .settings-bar {
            background: rgba(45, 45, 68, 0.9);
        }

        .settings-left, .settings-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 20px;
            background: var(--light);
            transition: var(--transition);
        }

        .dark-mode .mode-toggle {
            background: #3a3a5a;
        }

        .mode-toggle:hover {
            background: var(--primary);
            color: white;
        }

        .mode-toggle i {
            font-size: 18px;
        }

        .translator-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 60px 1fr;
            gap: 20px;
            position: relative;
            transition: var(--transition);
        }

        .dark-mode .translator-container {
            background: #2d2d44;
            color: #f0f0f0;
        }

        @media (max-width: 900px) {
            .translator-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 60px auto;
            }
        }

        .language-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: #f0f0f0;
            border-radius: 8px;
            transition: var(--transition);
        }

        .dark-mode .section-header {
            background: #3a3a5a;
        }

        .language-select {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            background: white;
            transition: var(--transition);
            min-width: 150px;
        }

        .dark-mode select {
            background: #3a3a5a;
            color: #f0f0f0;
            border-color: #4a4a6a;
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .text-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            min-height: 250px;
            transition: var(--transition);
            background: white;
            color: var(--dark);
        }

        .dark-mode textarea {
            background: #3a3a5a;
            color: #f0f0f0;
            border-color: #4a4a6a;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .tools {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn i {
            font-size: 16px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(67, 97, 238, 0.3);
        }

        .btn-secondary {
            background: #e9ecef;
            color: var(--dark);
        }

        .dark-mode .btn-secondary {
            background: #3a3a5a;
            color: #f0f0f0;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .dark-mode .btn-secondary:hover {
            background: #4a4a6a;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #3ab0e0;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #e51e6b;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background: #e7850e;
        }

        .swap-btn {
            background: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            font-size: 24px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            box-shadow: var(--shadow);
        }

        .dark-mode .swap-btn {
            background: #536dfe;
        }

        .swap-btn:hover {
            background: var(--secondary);
            transform: rotate(180deg) scale(1.1);
            box-shadow: 0 6px 12px rgba(67, 97, 238, 0.4);
        }

        .history-container {
            margin-top: 30px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            transition: var(--transition);
        }

        .dark-mode .history-container {
            background: #2d2d44;
            color: #f0f0f0;
        }

        .history-container h2 {
            margin-bottom: 20px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dark-mode .history-container h2 {
            color: #f0f0f0;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .history-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            transition: var(--transition);
            cursor: pointer;
        }

        .dark-mode .history-item {
            background: #3a3a5a;
        }

        .history-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .history-item .original {
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 5px;
            font-size: 14px;
        }

        .dark-mode .history-item .original {
            color: #adb5bd;
        }

        .history-item .translated {
            color: var(--dark);
            font-size: 16px;
        }

        .dark-mode .history-item .translated {
            color: #f0f0f0;
        }

        .history-item small {
            color: var(--gray);
            display: block;
            margin-top: 8px;
            font-size: 12px;
        }

        .dark-mode .history-item small {
            color: #adb5bd;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            border-radius: var(--radius);
            min-width: 200px;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .dark-mode .loading {
            background: rgba(45, 45, 68, 0.95);
            color: #f0f0f0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            transform: translateX(400px);
            transition: var(--transition);
            z-index: 1000;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: #28a745;
        }

        .notification.error {
            background: #dc3545;
        }

        .notification.warning {
            background: #ffc107;
            color: #212529;
        }

        .notification.info {
            background: #17a2b8;
        }

        .api-status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .api-status.online {
            background: #d4edda;
            color: #155724;
        }

        .dark-mode .api-status.online {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
        }

        .api-status.offline {
            background: #f8d7da;
            color: #721c24;
        }

        .dark-mode .api-status.offline {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .settings-bar {
                flex-direction: column;
                gap: 10px;
            }

            .tools {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-language"></i> Universal Tarjimon Pro <i class="fas fa-globe-americas"></i></h1>
            <p>50+ tilda tezkor, aniq va bepul tarjima</p>

            </div>
            <div class="settings-right">

        </div>

        <div class="translator-container" id="translatorContainer">
            <div class="language-section">
                <div class="section-header">
                    <div class="language-select">
                        <select id="sourceLanguage">
                            <option value="auto">🤖 Avtomatik aniqlash</option>
                            <option value="uz">O'zbekcha</option>
                            <option value="en" selected>English</option>
                            <option value="ru">Русский</option>
                            <option value="es">Español</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="it">Italiano</option>
                            <option value="pt">Português</option>
                            <option value="tr">Türkçe</option>
                            <option value="ar">العربية</option>
                            <option value="zh">中文</option>
                            <option value="ja">日本語</option>
                            <option value="ko">한국어</option>
                            <option value="hi">हिन्दी</option>
                            <option value="bn">বাংলা</option>
                        </select>
                    </div>
                    <button class="btn btn-secondary" onclick="detectLanguage()" title="Tilni avtomatik aniqlash">
                        <i class="fas fa-search"></i> Tilni Aniqlash
                    </button>
                </div>
                <div class="text-area">
                    <textarea id="sourceText" placeholder="Tarjima qilinadigan matnni kiriting...">Hello world, how are you today? I love programming and learning new languages.</textarea>
                    <div class="tools">
                        <button class="btn btn-primary" onclick="translateText()">
                            <i class="fas fa-sync-alt"></i> Tarjima Qilish
                        </button>
                        <button class="btn btn-secondary" onclick="speakText('source')">
                            <i class="fas fa-volume-up"></i> Ovoz Chiqarish
                        </button>
                        <button class="btn btn-success" onclick="copyText('source')">
                            <i class="fas fa-copy"></i> Nusxalash
                        </button>
                    </div>
                </div>
            </div>

            <div style="display: flex; align-items: center; justify-content: center;">
                <button class="swap-btn" onclick="swapLanguages()" title="Tillardi almashtirish">
                    ⇄
                </button>
            </div>

            <div class="language-section">
                <div class="section-header">
                    <div class="language-select">
                        <select id="targetLanguage">
                            <option value="uz">O'zbekcha</option>
                            <option value="en">English</option>
                            <option value="ru">Русский</option>
                            <option value="es">Español</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="it">Italiano</option>
                            <option value="pt">Português</option>
                            <option value="tr">Türkçe</option>
                            <option value="ar">العربية</option>
                            <option value="zh">中文</option>
                            <option value="ja">日本語</option>
                            <option value="ko">한국어</option>
                            <option value="hi">हिन्दी</option>
                            <option value="bn">বাংলা</option>
                        </select>
                    </div>
                </div>
                <div class="text-area">
                    <textarea id="targetText" placeholder="Tarjima natijasi bu yerda ko'rsatiladi..." readonly></textarea>
                    <div class="tools">
                        <button class="btn btn-primary" onclick="saveTranslation()">
                            <i class="fas fa-star"></i> Saqlash
                        </button>
                        <button class="btn btn-secondary" onclick="speakText('target')">
                            <i class="fas fa-volume-up"></i> Ovoz Chiqarish
                        </button>
                        <button class="btn btn-success" onclick="copyText('target')">
                            <i class="fas fa-copy"></i> Nusxalash
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Tarjima qilinmoqda...</p>
        </div>

        <div class="history-container">

            <div class="history-list" id="historyList">
                <!-- Tarjima tarixi bu yerga qo'shiladi -->
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            // Apply dark mode if saved
            if (darkModeEnabled) {
                document.body.classList.add('dark-mode');
                document.getElementById('modeText').textContent = 'Light Mode';
            }

            loadHistory();
            checkAPIStatus();

            // Auto-translate on input (with debounce)
            let timeout;
            document.getElementById('sourceText').addEventListener('input', function() {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    if (this.value.trim().length > 2) {
                        translateText();
                    }
                }, 600);
            });

            // Initial translation
            setTimeout(translateText, 500);
        });

        // Toggle Dark Mode
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            darkModeEnabled = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', darkModeEnabled);

            const modeText = document.getElementById('modeText');
            modeText.textContent = darkModeEnabled ? 'Light Mode' : 'Dark Mode';

            showNotification(darkModeEnabled ? 'Dark Mode yoqildi' : 'Light Mode yoqildi', 'info');
        }

        // Check API Status
        async function checkAPIStatus() {
            try {
                const response = await fetch('https://libretranslate.de/translate', {
                    method: 'OPTIONS',
                    mode: 'no-cors'
                });

                // CORS cheklovi bo'lishi mumkin, shuning uchun faqat connectionni tekshiramiz
                const testResponse = await fetch('https://libretranslate.de/languages');
                if (testResponse.ok) {
                    libreTranslateOnline = true;
                    const statusEl = document.getElementById('apiStatus');
                    statusEl.className = 'api-status online';
                    statusEl.innerHTML = '<i class="fas fa-circle"></i><span>LibreTranslate Online</span>';
                } else {
                    throw new Error('API not responding');
                }
            } catch (error) {
                console.warn('LibreTranslate API ishlamayapti, offline tarjima ishlatiladi:', error);
                libreTranslateOnline = false;
                const statusEl = document.getElementById('apiStatus');
                statusEl.className = 'api-status offline';
                statusEl.innerHTML = '<i class="fas fa-circle"></i><span>Offline Tarjima</span>';
                showNotification('LibreTranslate API ishlamayapti. Offline lug\'at ishlatiladi.', 'warning');
            }
        }

        // MAIN TRANSLATE FUNCTION - API + Offline fallback
        async function translateText() {
            const sourceText = document.getElementById('sourceText').value.trim();
            const sourceLang = document.getElementById('sourceLanguage').value;
            const targetLang = document.getElementById('targetLanguage').value;

            if (!sourceText) {
                document.getElementById('targetText').value = '';
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';

            try {
                let translatedText = '';

                // 1. Avval LibreTranslate API ni sinab ko'ramiz (agar online bo'lsa)
                if (libreTranslateOnline && sourceLang !== 'auto') {
                    try {
                        translatedText = await translateWithLibreTranslate(sourceText, sourceLang, targetLang);
                    } catch (apiError) {
                        console.warn('API xatosi, offline tarjimaga o\'tilmoqda:', apiError);
                        libreTranslateOnline = false;
                        // Offline tarjimaga o'tish
                        translatedText = translateOffline(sourceText, sourceLang, targetLang);
                    }
                }
                // 2. Agar API ishlamasa yoki avtomatik til bo'lsa - offline tarjima
                else {
                    translatedText = translateOffline(sourceText, sourceLang, targetLang);
                }

                document.getElementById('targetText').value = translatedText;

                // Update stats
                translationCount++;
                localStorage.setItem('translationCount', translationCount);

                // Add to history
                addToHistory(sourceText, translatedText);

            } catch (error) {
                console.error('Tarjima xatosi:', error);
                document.getElementById('targetText').value = '❌ Tarjima qilishda xatolik yuz berdi.';
                showNotification('Tarjima qilishda xatolik!', 'error');
            } finally {
                // Hide loading
                document.getElementById('loading').style.display = 'none';
            }
        }

        // LibreTranslate API integration (working endpoint)
        async function translateWithLibreTranslate(text, sourceLang, targetLang) {
            // Alternative working endpoints (agar biri ishlamasa boshqasiga o'tish)
            const endpoints = [
                'https://libretranslate.de',
                'https://translate.argosopentech.com',
                'https://libretranslate.com'
            ];

            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(endpoint + '/translate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            q: text,
                            source: sourceLang,
                            target: targetLang,
                            format: 'text'
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        return data.translatedText;
                    }
                } catch (error) {
                    console.warn(`Endpoint ${endpoint} ishlamadi:`, error);
                    continue;
                }
            }

            throw new Error('Barcha API endpointlari ishlamadi');
        }

        // Offline translation (kengaytirilgan lug'at)
        function translateOffline(text, sourceLang, targetLang) {
            // Agar ikkala til ham o'zbek yoki ingliz bo'lsa
            if ((sourceLang === 'uz' && targetLang === 'en') ||
                (sourceLang === 'en' && targetLang === 'uz') ||
                sourceLang === 'auto') {

                // Matnni so'zlarga ajratish
                const words = text.toLowerCase()
                    .replace(/[^\w\s']/g, ' ')  // Belgilarni olib tashlash
                    .split(/\s+/)
                    .filter(word => word.length > 0);

                // Har bir so'zni tarjima qilish
                const translatedWords = words.map(word => {
                    // To'liq ifoda qidirish (masalan: "thank you")
                    for (let i = 3; i >= 1; i--) {
                        const phrase = words.slice(words.indexOf(word), words.indexOf(word) + i).join(' ');
                        const translation = offlineDictionary[phrase];
                        if (translation) {
                            // Keyingi so'zlarni o'tkazib yuborish
                            for (let j = 1; j < i; j++) {
                                words[words.indexOf(word) + j] = '';
                            }
                            return translation;
                        }
                    }

                    // Yakka so'zni qidirish
                    return offlineDictionary[word] || word;
                }).filter(word => word !== '');

                // Natijani qaytarish
                return translatedWords.join(' ');
            }

            // Boshqa tillar uchun oddiy ko'rsatma
            return `[${getLanguageName(targetLang)} tarjimasi]: ${text}`;
        }

        // Detect language function
        async function detectLanguage() {
            const text = document.getElementById('sourceText').value.trim();
            if (!text) {
                showNotification('Iltimos, matnni kiriting!', 'error');
                return;
            }

            // Simple detection based on common characters
            if (/[а-яА-ЯёЁ]/.test(text)) {
                document.getElementById('sourceLanguage').value = 'ru';
                showNotification('Til aniqlandi: Русский', 'success');
            } else if (/[a-zA-Z]/.test(text) && !/[а-яА-ЯёЁ]/.test(text)) {
                document.getElementById('sourceLanguage').value = 'en';
                showNotification('Til aniqlandi: English', 'success');
            } else if (/[oʻgʻsh]/.test(text) || /[чўғ]/.test(text)) {
                document.getElementById('sourceLanguage').value = 'uz';
                showNotification('Til aniqlandi: O\'zbekcha', 'success');
            } else if (/[\u0600-\u06FF]/.test(text)) {
                document.getElementById('sourceLanguage').value = 'ar';
                showNotification('Til aniqlandi: العربية', 'success');
            } else {
                showNotification('Til aniqlanmadi. Avtomatik tarjima ishlatiladi.', 'info');
            }

            // Translate after detection
            translateText();
        }

        // Swap languages function
        function swapLanguages() {
            const sourceLang = document.getElementById('sourceLanguage').value;
            const targetLang = document.getElementById('targetLanguage').value;
            const sourceText = document.getElementById('sourceText').value;
            const targetText = document.getElementById('targetText').value;

            document.getElementById('sourceLanguage').value = targetLang;
            document.getElementById('targetLanguage').value = sourceLang;
            document.getElementById('sourceText').value = targetText;
            document.getElementById('targetText').value = sourceText;

            // Animate swap
            const swapBtn = document.querySelector('.swap-btn');
            swapBtn.style.transform = 'rotate(180deg) scale(1.2)';
            setTimeout(() => {
                swapBtn.style.transform = 'rotate(0deg) scale(1)';
            }, 300);

            // Auto-translate if there's text
            if (targetText) {
                translateText();
            }
        }

        // Text-to-speech function
        function speakText(type) {
            const text = type === 'source'
                ? document.getElementById('sourceText').value
                : document.getElementById('targetText').value;

            if (!text.trim()) {
                showNotification('Ovoz chiqarish uchun matn kiriting!', 'error');
                return;
            }

            try {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = type === 'source'
                    ? getSpeechLang(document.getElementById('sourceLanguage').value)
                    : getSpeechLang(document.getElementById('targetLanguage').value);
                utterance.rate = 0.9;
                utterance.pitch = 1;

                window.speechSynthesis.speak(utterance);
                showNotification('Matn o\'qilmoqda...', 'success');
            } catch (error) {
                console.error('Speech synthesis error:', error);
                showNotification('Ovoz chiqarish funksiyasi qo\'llab-quvvatlanmaydi!', 'error');
            }
        }

        // Helper for speech language codes
        function getSpeechLang(code) {
            const speechLangs = {
                'en': 'en-US',
                'uz': 'uz-UZ',
                'ru': 'ru-RU',
                'es': 'es-ES',
                'fr': 'fr-FR',
                'de': 'de-DE',
                'it': 'it-IT',
                'pt': 'pt-PT',
                'tr': 'tr-TR',
                'ar': 'ar-SA',
                'zh': 'zh-CN',
                'ja': 'ja-JP',
                'ko': 'ko-KR',
                'hi': 'hi-IN',
                'bn': 'bn-IN'
            };
            return speechLangs[code] || 'en-US';
        }

        // Copy text function
        function copyText(type) {
            const text = type === 'source'
                ? document.getElementById('sourceText').value
                : document.getElementById('targetText').value;

            if (!text.trim()) {
                showNotification('Nusxalash uchun matn kiriting!', 'error');
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                showNotification('Matn muvaffaqiyatli nusxalandi!', 'success');
            }).catch(err => {
                console.error('Copy error:', err);
                // Fallback method
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showNotification('Matn nusxalandi!', 'success');
            });
        }

        // Clear all function
        function clearAll() {
            document.getElementById('sourceText').value = '';
            document.getElementById('targetText').value = '';
            showNotification('Barcha maydonlar tozalandi!', 'success');
        }

        // Save translation function
        function saveTranslation() {
            const sourceText = document.getElementById('sourceText').value.trim();
            const targetText = document.getElementById('targetText').value.trim();
            const sourceLang = document.getElementById('sourceLanguage').value;
            const targetLang = document.getElementById('targetLanguage').value;

            if (!sourceText || !targetText) {
                showNotification('Saqlash uchun tarjima qiling!', 'error');
                return;
            }

            const translation = {
                id: Date.now(),
                source: sourceText,
                target: targetText,
                sourceLang: getLanguageName(sourceLang),
                targetLang: getLanguageName(targetLang),
                date: new Date().toLocaleString('uz-UZ')
            };

            // Check if already saved
            const exists = savedTranslations.some(t =>
                t.source === translation.source && t.target === translation.target
            );

            if (exists) {
                showNotification('Bu tarjima allaqachon saqlangan!', 'warning');
                return;
            }

            savedTranslations.push(translation);
            localStorage.setItem('savedTranslations', JSON.stringify(savedTranslations));

            showNotification('Tarjima saqlandi! ⭐', 'success');
            loadHistory();
        }

        // Add to history function
        function addToHistory(sourceText, targetText) {
            const historyItem = {
                id: Date.now(),
                source: sourceText,
                target: targetText,
                sourceLang: getLanguageName(document.getElementById('sourceLanguage').value),
                targetLang: getLanguageName(document.getElementById('targetLanguage').value),
                date: new Date().toLocaleString('uz-UZ')
            };

            translationHistory.unshift(historyItem); // Add to beginning

            // Keep only last 50 items
            if (translationHistory.length > 50) {
                translationHistory = translationHistory.slice(0, 50);
            }

            localStorage.setItem('translationHistory', JSON.stringify(translationHistory));
            loadHistory();
        }

        // Load history function
        function loadHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';

            if (translationHistory.length === 0 && savedTranslations.length === 0) {
                historyList.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 20px; color: var(--gray);">Hozircha tarjima tarixi yo\'q</div>';
                return;
            }

            // Show saved translations first
            [...savedTranslations, ...translationHistory].slice(0, 12).forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <div class="original">${item.sourceLang}: ${truncateText(item.source, 50)}</div>
                    <div class="translated">${item.targetLang}: ${truncateText(item.target, 50)}</div>
                    <small>${item.date}</small>
                `;
                historyItem.onclick = () => restoreTranslation(item);
                historyList.appendChild(historyItem);
            });
        }

        // Restore translation from history
        function restoreTranslation(item) {
            document.getElementById('sourceText').value = item.source;
            document.getElementById('targetText').value = item.target;
            translateText();
            showNotification('Tarjima maydonlarga qaytarildi!', 'success');
        }

        // Show notification function
        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' :
                           type === 'error' ? 'exclamation-circle' :
                           type === 'warning' ? 'exclamation-triangle' : 'info-circle'}"></i>
                ${message}
            `;
            notification.className = `notification ${type} show`;

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3500);
        }

        // Helper function to get language name
        function getLanguageName(code) {
            const languages = {
                'uz': 'O\'zbekcha',
                'en': 'English',
                'ru': 'Русский',
                'es': 'Español',
                'fr': 'Français',
                'de': 'Deutsch',
                'it': 'Italiano',
                'pt': 'Português',
                'tr': 'Türkçe',
                'ar': 'العربية',
                'zh': '中文',
                'ja': '日本語',
                'ko': '한국어',
                'hi': 'हिन्दी',
                'bn': 'বাংলা',
                'auto': 'Avtomatik'
            };
            return languages[code] || code.toUpperCase();
        }

        // Truncate text helper
        function truncateText(text, maxLength) {
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Ctrl + Enter to translate
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                translateText();
            }
            // Ctrl + S to save
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveTranslation();
            }
        });
    </script>
</body>
</html>
